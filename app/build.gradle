import com.android.build.gradle.internal.tasks.FinalizeBundleTask

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'kotlin-parcelize'
    id 'dagger.hilt.android.plugin'
    id 'com.google.devtools.ksp'
    id 'com.jaredsburrows.license'
}

android {
    namespace 'audio.omgsoundboard'
    compileSdk 36

    defaultConfig {
        applicationId "audio.omgsoundboard"
        minSdk 24
        targetSdk 36
        versionCode 21
        versionName "21.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        resourceConfigurations += ["en"]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions = ["repository"]

    productFlavors {
        "foss" {
            dimension "repository"
        }
        "google" {
            dimension "repository"
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def flavorName = variant.flavorName ? variant.flavorName.capitalize() : ""
            def apkName = "OMGSoundboard_${flavorName}_${versionCode}.apk"
            outputFileName = apkName
        }

        tasks.named("sign${variant.flavorName.capitalize()}${variant.buildType.name.capitalize()}Bundle", FinalizeBundleTask) { task ->
            def file = task.finalBundleFile.get().asFile
            def flavorName = variant.flavorName ? variant.flavorName.capitalize() : ""
            def finalFile = new File(file.parentFile, "OMGSoundboard_${flavorName}_${versionCode}.aab")
            task.finalBundleFile.set(finalFile)
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.3'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    // https://f-droid.org/docs/Reproducible_Builds/#png-crushcrunch
     aaptOptions {
        cruncherEnabled = false
    }
}

dependencies {
    implementation project(path: ':core')
    implementation project(path: ':sync_manager')

    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.2'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation "androidx.compose.ui:ui:$compose_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_version"
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_version"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_version"


    // Compose Nav Destinations
    implementation "androidx.navigation:navigation-compose:2.9.6"

    //Room
    implementation "androidx.room:room-ktx:2.8.4"
    ksp "androidx.room:room-compiler:2.8.4"

    //Dagger - Hilt
    implementation "com.google.dagger:hilt-android:2.57.2"
    ksp "com.google.dagger:hilt-android-compiler:2.57.2"
    ksp "androidx.hilt:hilt-compiler:1.3.0"
    implementation 'androidx.hilt:hilt-navigation-compose:1.3.0'

    //Splash Screen
    implementation 'androidx.core:core-splashscreen:1.0.1'

    //Particles
    implementation "me.nikhilchaudhari:quarks:1.0.0-alpha02"

    //Icons
    implementation("androidx.compose.material:material-icons-extended:1.7.8")

    //Coil
    implementation("io.coil-kt.coil3:coil-compose:3.3.0")
    
    //Widgets
    implementation "androidx.glance:glance-appwidget:1.1.1"
    implementation "androidx.glance:glance-material3:1.1.1"
}
